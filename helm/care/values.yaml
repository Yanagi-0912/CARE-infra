# 預設 values；CI 部署時以 --set 覆寫映像 tag，Secret 由 CI 另行建立。

namespace:
  # false：namespace 由 kubectl / helm --create-namespace 建立（避免與既有 care-dev 衝突）
  create: false
  name: care-dev

# 對外入口（Ingress / n8n webhook / CORS）
public:
  scheme: https
  host: "care.jamessu2016.com"

ingress:
  enabled: true
  # K3s 內建 Traefik；若叢集用 ingress-nginx 可改為 nginx
  className: traefik

secret:
  # false：由 CI 或 kubectl 建立 care-backend-secret（建議）
  create: false
  name: care-backend-secret
  data: {}

backend:
  name: care-backend
  replicaCount: 1
  image:
    repository: yanagi0912/care
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
  config:
    MODEL_NAME: "gemini-2.5-flash"
    EMBEDDING_MODEL: "gemini-embedding-001"
    LIFF_URL: "https://liff.line.me/2009177739-JJrPzjAn"
    MONGODB_DB: "CARE_database"
    MONGODB_COLLECTION: "health_articles_chunks"
    MONGODB_VECTOR_INDEX: "vector_index"
    MONGODB_VECTOR_FIELD: "embedding"
    MONGODB_TEXT_FIELD: "chunk_content"
    MONGODB_VECTOR_DIM: "3072"
    # Atlas Search（BM25）；與 vector_index 不同的索引
    MONGODB_TEXT_INDEX: "care_text_index"
    # 使用者上傳文件暫存（與官方 KB 分離；Atlas 需有對應 Vector Search index）
    MONGODB_USER_DOCS_COLLECTION: "user_document_chunks"
    MONGODB_USER_DOCS_VECTOR_INDEX: "user_document_chunks_vector"
    USER_DOCS_TTL_SECONDS: "86400"
    # Hybrid retrieval：向量 + BM25，RRF 融合
    RAG_HYBRID_ENABLED: "true"
    RAG_RRF_K: "60"
    # 空字串：由 n8n.provisioning.webhookPath 推導出 http://n8n-service:<port>/webhook/<path>。
    # 留空是刻意的——backend 打的路徑與 n8n 實際註冊的路徑必須是同一個值，
    # 分開寫遲早會分岔（2026-08 就發生過：repo 是 multimedia-process、線上是 UUID）。
    # 真的要指向叢集外的 n8n 才在這裡填絕對網址。
    MEDIA_PARSE_WEBHOOK_URL: ""
    # 空字串：依 public.scheme + public.host（LINE TTS 音檔公開網址）
    PUBLIC_BASE_URL: ""
    # 預設依 public.host 組出；可在此覆寫
    CORS_ALLOW_ORIGINS: ""

# 背景排程器（用藥提醒、每日諮詢摘要），與 backend 共用同一個 image。
#
# enabled 與 backend 的 APP_ROLE 由 backend-deployment.yaml 的模板條件綁在一起，
# 不能各自獨立設定：
#   true  → 建立本 Deployment（APP_ROLE=scheduler），backend 轉為 APP_ROLE=api
#   false → 不建立本 Deployment，backend 維持 APP_ROLE=all 自己跑排程
# 綁在一起是為了排除「兩邊都不跑排程」這個組合——用藥提醒錯過的時段不補推播，
# 沒有任何補救路徑。
#
# ⚠ 從 false 切到 true 的那一次部署要挑時間。backend 換成 APP_ROLE=api 與
# scheduler pod 變成 Ready 是兩個獨立的 reconcile，中間必然有一段沒有任何行程
# 在跑排程的空窗（映像拉取 + 約 5 秒啟動）。若空窗剛好橫跨某個服藥時段的分鐘，
# 那個時段就永久錯過。預設時段是 08:00 / 12:00 / 18:00 / 21:30，避開這四個
# 時間點前後各十分鐘再執行 helm upgrade。之後的一般部署沒有這個問題——
# 那時 backend 已經是 api，不再參與排程。
scheduler:
  name: care-scheduler
  enabled: true
  # 沒有 replicaCount：排程器不做水平擴充，多開只是讓更多實例爭搶同一批推播權。
  # 要提高吞吐應該調 check_interval，不是加 replica。
  resources:
    # 這組數字來自實測，不是估的。
    #
    # 開發機（macOS/arm64，`APP_ROLE=scheduler python -c "import app.main"` 取
    # ru_maxrss）：直譯器 13.8 MiB → import 後 393.2 MiB，啟動 2.24s（CPU 未受限）。
    # 載入的是藥證庫 66,478 筆與 56,763 個 n-gram key。
    #
    # 線上（`kubectl top pod -n care-dev`，care-backend 閒置中）：328Mi。
    # 以線上數字為準——Linux 容器的配置器與頁面行為和 macOS 不同，實際比開發機
    # 低約 65 MiB。requests 取 350Mi（略高於觀測值，讓 QoS 不會在節點吃緊時
    # 被優先驅逐），limits 與 backend 同為 512Mi。
    #
    # 重點：排程器 pod **並不比 backend 輕**。app/dependencies.py:354 是模組層級
    # 載入，只要 import app.main 就會把藥證庫與 n-gram 索引整個建起來，跟角色
    # 無關。原本以為「排程器只查 DB 和推播所以很省」是錯的，記憶體上限必須與
    # backend 同級，設低了會在啟動當下就 OOMKilled。
    #
    # 這 393 MiB 對排程器而言是純粹的死重（它從不查藥證庫）。要真正省下來得把
    # 載入改成延遲初始化，但那會把建索引的 CPU 成本搬到第一次藥袋掃描的請求上，
    # 而那是條 async 路徑——等於製造另一個事件迴圈阻塞。不划算，維持現況。
    #
    # 註：量測在 macOS 上做，Linux 容器的 RSS 會有出入，上線後應以實際峰值校正。
    requests:
      cpu: 100m
      memory: 350Mi
      ephemeral-storage: 256Mi
    limits:
      # CPU 與 backend 同級而非更低：啟動時建 n-gram 索引是 CPU 密集的，
      # cpu limit 是 CFS quota，設太低會等比例拉長啟動時間
      #   500m → 約 4.5s   200m → 約 11s
      # 而 probe 的預算有限（見 scheduler-deployment.yaml 的 startupProbe）。
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi

frontend:
  name: care-frontend
  replicaCount: 1
  image:
    repository: yanagi0912/care-liff
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 300m
      memory: 256Mi
      ephemeral-storage: 512Mi

n8n:
  name: care-n8n
  replicaCount: 1
  image:
    repository: n8nio/n8n
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8100
  port: 8100
  path: /n8n/
  protocol: http
  timezone: Asia/Taipei
  secureCookie: "false"
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

  # n8n 的加密金鑰。憑證在 credentials_entity 表裡是用這把金鑰加密的。
  #
  # fromSecret: false —— 目前金鑰只存在 PVC 的 /home/node/.n8n/config（2026-05-19 產生）。
  # PVC 一旦重建，n8n 會產生一把新的，既有憑證全部解不開，而錯誤訊息與「憑證不存在」
  # 極相似，非常難分辨。
  #
  # 要開啟必須先把「現有的那把」存進 Secret，不能給新值：
  #   kubectl exec -n care-dev deploy/care-n8n -- cat /home/node/.n8n/config
  #   # 取出其中的 encryptionKey，存成 GitHub secret N8N_ENCRYPTION_KEY，
  #   # 由 cicd.yml 寫進 care-backend-secret，再把下面改成 true。
  #
  # 註：provisioning 打開後，Gemini 這筆憑證每次 pod 啟動都會用當下的金鑰重新匯入，
  # 所以就算金鑰換掉它也會自動修復。這裡的風險只對「手動在 UI 建立、未納入 provisioning」
  # 的其他憑證成立。
  encryptionKey:
    fromSecret: false
    secretName: care-backend-secret
    secretKey: N8N_ENCRYPTION_KEY

  # 把 n8n 的「內容」（憑證 + workflow）納入部署，而不是靠人手動在 UI 或 CLI 補。
  #
  # 背景：2026-08-04 起圖片辨識全數失敗，原因是這台 n8n 的 credentials_entity 是 0 筆。
  # workflow JSON 只帶 credential ID，憑證本體加密存在各自的資料庫裡，不會跟著 JSON 走，
  # 所以從別台 n8n 匯出的 workflow 到這裡一定對不上。同時 CARE-n8n repo 與線上也沒有
  # 任何同步機制，repo 早就把模型改成 gemini-2.5-flash，線上卻還在用已下架的
  # gemini-robotics-er-1.5-preview。兩件事都靠這個區塊解掉。
  provisioning:
    enabled: true

    # true：provisioning 失敗就讓 pod 起不來。
    # 刻意不採「失敗就略過」——一個沒有憑證卻正常運行的 n8n，對外的症狀只是
    # backend 回 validation_error，看不出真因。寧可部署失敗也不要靜默降級。
    # 全新安裝、n8n 還沒建立 owner 帳號時，把這裡設為 false 跑第一次。
    failOnError: true

    # 憑證 ID 固定寫死，讓 workflow 裡的引用永遠有效。
    # 這個值就是線上正在用的那筆，不要隨意更動。
    credentialId: "ZX3WWvD2O6rBruGC"
    credentialName: "Google Gemini(PaLM) Api account"
    credentialSecretName: care-backend-secret
    credentialSecretKey: GEMINI_API_KEY
    geminiHost: "https://generativelanguage.googleapis.com"

    # workflow ID 固定：import 時沿用同一個 ID 才是覆蓋，否則會多出第二個 workflow，
    # 而 backend 打的 webhook 仍指向舊的那個。
    workflowId: "yKC658rkbLy0I3KC"

    # webhook path。這個值同時決定：
    #   1. n8n Webhook node 註冊的路徑（init container 會覆寫 JSON 裡的值）
    #   2. backend 的 MEDIA_PARSE_WEBHOOK_URL（見 _helpers.tpl）
    # 兩者由同一個值推導，不可能再分岔。
    #
    # 目前維持線上的 UUID，讓這次改動對行為完全中性。
    # 要換成可讀的路徑（CARE-n8n repo 裡是 multimedia-process），改這一行即可——
    # backend 與 n8n 會在同一次 helm upgrade 一起換過去。
    webhookPath: "bff1fd27-efc4-45cf-b64a-adb0475aa35c"

    # workflow JSON 來自 CARE-n8n repo，由 CI 建成 ConfigMap（helm 讀不到跨 repo 的檔案）。
    # ConfigMap 的 key 不能有空白，所以檔名 "mutimedia process.json" 在 CI 端改名。
    workflowConfigMap: n8n-workflows
    workflowKey: "mutimedia-process.json"

    # CI 以 --set 傳入 workflow 檔的 sha256，寫進 pod annotation。
    # 內容有變才滾動更新；沒變的部署不會白白重啟 n8n。
    workflowChecksum: "unset"

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      ephemeral-storage: 1Gi
  # n8n-config ConfigMap：整個 n8n stack 共用（n8n / local-asr / local-parser 都 envFrom 它）
  config:
    WHISPER_MODEL: "small"
    WHISPER_COMPUTE_TYPE: "int8"
    # 只用 faster-whisper，不走 Breeze-ASR-26（hybrid）。Breeze 權重 6.17 GB，fp32 在
    # CPU 上需要 6GB 以上記憶體，而節點總共 7.8Gi（2026-09-12 free -h）；它的依賴
    # torch 也讓映像壓縮後 3.48 GB，那次部署把節點磁碟推到 95%、觸發驅逐、整站 502。
    # local_asr 的預設值也已改成 faster-whisper，這裡寫明是為了讓線上設定一眼看得到。
    ASR_BACKEND: "faster-whisper"
    PARSER_MAX_FILE_SIZE_MB: "20"

# 語音轉文字；n8n workflow 以 http://local-asr:8200/transcribe 呼叫。
#
# enabled: false —— 這個服務仍在開發中，尚未部署。關閉時整組資源（Deployment /
# Service / PVC）都不建立，n8n 的語音分支因此打不到後端，使用者傳語音會收到
# 「無法辨識」的提示。這是已知且刻意的狀態，不是故障。
#
# 開啟前要注意：映像含 torch + transformers，通常 2~5GB，且首次啟動會下載
# Breeze-ASR-26 的模型權重到 PVC。本專案有過映像堆積撐爆磁碟、觸發 kubelet
# 驅逐的紀錄（見 cicd.yml 的映像清理說明），開啟前先確認節點磁碟餘裕。
asr:
  enabled: false
  name: care-asr
  replicaCount: 1
  image:
    repository: yanagi0912/care-asr
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8200
  port: 8200
  persistence:
    # 關閉時改用 emptyDir，代價是每次 pod 重啟都重新下載 Whisper 模型
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      # whisper small + int8 常駐約 1GB；CPU 給越多轉錄越快
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
      ephemeral-storage: 1Gi

# 文件解析（pdf / docx / xlsx / pptx / html …）；n8n workflow 以
# http://local-parser:8100/parse 呼叫。
#
# enabled: false —— 同 asr，仍在開發中尚未部署。關閉時使用者上傳檔案會收到
# 「無法辨識」的提示，且 media_handler 的文件 ingest（把解析結果存進使用者
# 專屬 RAG 向量庫）也不會發生。
parser:
  enabled: false
  name: care-parser
  replicaCount: 1
  image:
    repository: yanagi0912/care-parser
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8100
  port: 8100
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 512Mi
