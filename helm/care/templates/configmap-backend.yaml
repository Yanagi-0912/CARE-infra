apiVersion: v1
kind: ConfigMap
metadata:
  name: care-backend-config
  namespace: {{ include "care.namespace" . }}
  labels:
    {{- include "care.backend.labels" . | nindent 4 }}
data:
  MODEL_NAME: {{ .Values.backend.config.MODEL_NAME | quote }}
  EMBEDDING_MODEL: {{ .Values.backend.config.EMBEDDING_MODEL | quote }}
  LIFF_URL: {{ .Values.backend.config.LIFF_URL | quote }}
  MONGODB_DB: {{ .Values.backend.config.MONGODB_DB | quote }}
  MONGODB_COLLECTION: {{ .Values.backend.config.MONGODB_COLLECTION | quote }}
  MONGODB_VECTOR_INDEX: {{ .Values.backend.config.MONGODB_VECTOR_INDEX | quote }}
  MONGODB_VECTOR_FIELD: {{ .Values.backend.config.MONGODB_VECTOR_FIELD | quote }}
  MONGODB_TEXT_FIELD: {{ .Values.backend.config.MONGODB_TEXT_FIELD | quote }}
  MONGODB_VECTOR_DIM: {{ .Values.backend.config.MONGODB_VECTOR_DIM | quote }}
  MONGODB_TEXT_INDEX: {{ .Values.backend.config.MONGODB_TEXT_INDEX | quote }}
  # pgvector：RAG 的向量檢索（2026-09-19 從 Atlas 搬出，因 3072 維向量撐爆
  # 免費層 512 MB 導致寫入被鎖）。連線字串含密碼，走 Secret 的 PGVECTOR_DSN。
  PGVECTOR_TABLE: {{ .Values.backend.config.PGVECTOR_TABLE | quote }}
  PGVECTOR_VECTOR_COLUMN: {{ .Values.backend.config.PGVECTOR_VECTOR_COLUMN | quote }}
  MONGODB_USER_DOCS_COLLECTION: {{ .Values.backend.config.MONGODB_USER_DOCS_COLLECTION | quote }}
  MONGODB_USER_DOCS_VECTOR_INDEX: {{ .Values.backend.config.MONGODB_USER_DOCS_VECTOR_INDEX | quote }}
  USER_DOCS_TTL_SECONDS: {{ .Values.backend.config.USER_DOCS_TTL_SECONDS | quote }}
  RAG_HYBRID_ENABLED: {{ .Values.backend.config.RAG_HYBRID_ENABLED | quote }}
  RAG_RRF_K: {{ .Values.backend.config.RAG_RRF_K | quote }}
  # 家庭權限的總閘，說明見 values.yaml。不用 `default "true"`：Helm 的 default 把
  # 布林 false 當成空值，values 寫 FAMILY_RBAC_ENFORCED: false 會被換回 "true"，
  # 回滾就靜靜失效。改用 hasKey，只有缺鍵時才給 "true"（與程式預設相同）。
  FAMILY_RBAC_ENFORCED: {{ if hasKey .Values.backend.config "FAMILY_RBAC_ENFORCED" }}{{ .Values.backend.config.FAMILY_RBAC_ENFORCED | toString | quote }}{{ else }}"true"{{ end }}
  MEDIA_PARSE_WEBHOOK_URL: {{ include "care.mediaParseWebhookUrl" . | quote }}
  # care-tts 的叢集內位址；tts.enabled 為 false 時是空字串，backend 就自己合成。
  TTS_SERVICE_URL: {{ include "care.ttsServiceUrl" . | quote }}
  PUBLIC_BASE_URL: {{ include "care.publicBaseUrl" . | quote }}
  CORS_ALLOW_ORIGINS: {{ include "care.corsAllowOrigins" . | quote }}
