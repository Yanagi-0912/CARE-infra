{{- if .Values.ingress.enabled }}
# 標準 Kubernetes Ingress；由叢集的 Ingress Controller 實作路由（K3s 預設為 Traefik）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: care-app
  namespace: {{ include "care.namespace" . }}
  labels:
    {{- include "care.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /n8n
            pathType: Prefix
            backend:
              service:
                name: n8n-service
                port:
                  number: {{ .Values.n8n.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /line
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.service.port }}
          # 語音回覆的音檔。LINE 在使用者按播放時會來拿：2026-09-15 10:55 送出的語音，
          # 11:00:30 按播放時 LINE 才來抓，那時檔案已隨 10:56 的部署消失。tts.enabled 時
          # 導到 care-tts（音檔存在它的 PVC），否則導回 backend 自己存的檔。
          - path: /tts
            pathType: Prefix
            backend:
              service:
                {{- if .Values.tts.enabled }}
                name: {{ .Values.tts.name }}
                port:
                  number: {{ .Values.tts.service.port }}
                {{- else }}
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.service.port }}
                {{- end }}
          # 藥丸縮圖的靜態服務（app/routers/drug_appearance/images.py）。
          # 這條路由是功能本身的一部分，不是可選的優化：LINE 伺服器會在推播
          # 渲染當下來抓這個 URL，漏了這條就落到下面的 / 規則、拿到前端的
          # index.html，圖片永遠載不出來（LIFF 端的 PillThumbnail 會靜靜隱藏，
          # 版面不破，所以這個缺口不會以錯誤的形式現身，只會「沒有照片」）。
          - path: /drug-appearance
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.name }}
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
