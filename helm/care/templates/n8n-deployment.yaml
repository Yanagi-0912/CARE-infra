apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.n8n.name }}
  namespace: {{ include "care.namespace" . }}
  labels:
    {{- include "care.n8n.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.n8n.replicaCount }}
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
      {{- if .Values.n8n.provisioning.enabled }}
      annotations:
        # CI 以 --set 傳入 workflow 檔的 sha256。內容有變才會滾動更新，
        # 沒變的部署不會白白重啟 n8n（provisioning 只在 pod 啟動時跑）。
        care.dev/n8n-workflow-checksum: {{ .Values.n8n.provisioning.workflowChecksum | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.n8n.provisioning.enabled }}
      # n8n 的憑證與 workflow 都存在 PVC 的 SQLite 裡，helm 管不到。
      # 這個 init container 讓它們變成部署的一部分：
      #   1. 用 Secret 裡的 GEMINI_API_KEY 建立 googlePalmApi 憑證（ID 固定）
      #   2. 匯入 CARE-n8n repo 的 workflow（ID / webhook path / 憑證綁定由 values 正規化）
      #   3. 啟用 workflow
      #
      # 為什麼是 init container 而不是部署後 kubectl exec：
      # n8n 的 CLI 會警告「n8n 執行中的話變更不會生效」，import 後 workflow 也會
      # 變成停用狀態。在 init container 裡做的話 n8n 還沒啟動，這兩個問題都不存在。
      initContainers:
        - name: provision
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          env:
            - name: N8N_CRED_ID
              value: {{ .Values.n8n.provisioning.credentialId | quote }}
            - name: N8N_CRED_NAME
              value: {{ .Values.n8n.provisioning.credentialName | quote }}
            - name: N8N_GEMINI_HOST
              value: {{ .Values.n8n.provisioning.geminiHost | quote }}
            - name: N8N_WORKFLOW_ID
              value: {{ .Values.n8n.provisioning.workflowId | quote }}
            - name: N8N_WEBHOOK_PATH
              value: {{ include "care.n8nWebhookPath" . | quote }}
            - name: N8N_WORKFLOW_SRC
              value: "/provision/workflows/{{ .Values.n8n.provisioning.workflowKey }}"
            - name: PROVISION_FAIL_ON_ERROR
              value: {{ .Values.n8n.provisioning.failOnError | quote }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.n8n.provisioning.credentialSecretName | quote }}
                  key: {{ .Values.n8n.provisioning.credentialSecretKey | quote }}
                  optional: true
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-workflows
              mountPath: /provision/workflows
              readOnly: true
          resources:
            {{- toYaml .Values.n8n.provisioning.resources | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u

              # failOnError=true 時讓 pod 起不來，而不是靜靜地跑一個沒有憑證的 n8n。
              # 2026-08 的故障就是後者：憑證從 8/4 起就不存在，但一切看起來都正常，
              # backend 只回 validation_error，花了十幾輪才查到。
              fail() {
                echo "[provision] ERROR: $1" >&2
                if [ "${PROVISION_FAIL_ON_ERROR}" = "true" ]; then
                  exit 1
                fi
                echo "[provision] failOnError=false，略過 provisioning，n8n 照常啟動" >&2
                exit 0
              }

              [ -n "${GEMINI_API_KEY:-}" ] || fail "Secret 裡沒有 GEMINI_API_KEY，無法建立 Gemini 憑證"
              [ -f "$N8N_WORKFLOW_SRC" ] || fail "找不到 $N8N_WORKFLOW_SRC，ConfigMap n8n-workflows 尚未由 CI 建立？"

              umask 077

              # 用 node 產生 JSON，避免 API key 被 shell 的引號處理弄壞，也不會出現在 ps 裡
              node -e '
                const fs = require("fs");
                fs.writeFileSync("/tmp/cred.json", JSON.stringify([{
                  id:   process.env.N8N_CRED_ID,
                  name: process.env.N8N_CRED_NAME,
                  type: "googlePalmApi",
                  data: { host: process.env.N8N_GEMINI_HOST, apiKey: process.env.GEMINI_API_KEY },
                }]));
              ' || fail "產生憑證 JSON 失敗"

              n8n import:credentials --input=/tmp/cred.json || fail "import:credentials 失敗"
              rm -f /tmp/cred.json
              echo "[provision] 憑證 $N8N_CRED_ID 已就位"

              # 把 repo 那份正規化成這個環境該有的樣子。
              # workflow JSON 只帶 credential ID，憑證本體在各自的資料庫裡，
              # 所以從別台 n8n 匯出的檔案一定帶著錯的 ID —— 這裡強制覆寫。
              node -e '
                const fs = require("fs");
                const raw = JSON.parse(fs.readFileSync(process.env.N8N_WORKFLOW_SRC, "utf8"));
                const wfs = Array.isArray(raw) ? raw : [raw];
                let webhook = 0, gemini = 0;
                for (const w of wfs) {
                  // n8n 的「複製節點」與「Download」匯出格式不同：前者只有
                  // nodes/connections/meta/pinData，少了 name 與 settings。
                  // settings.executionOrder 決定節點執行順序、binaryMode 決定
                  // 二進位資料處理方式，缺了會靜默改變行為，所以在這裡擋下來。
                  if (!w.name) throw new Error("workflow 缺少 name，看起來是節點複製格式而非完整匯出");
                  if (!w.settings || !w.settings.executionOrder) {
                    throw new Error("workflow 缺少 settings.executionOrder，請用 n8n 的 Download 匯出完整檔案");
                  }
                  w.id = process.env.N8N_WORKFLOW_ID;
                  for (const n of w.nodes || []) {
                    const type = n.type || "";
                    if (type.endsWith("n8n-nodes-base.webhook")) {
                      n.parameters = n.parameters || {};
                      n.parameters.path = process.env.N8N_WEBHOOK_PATH;
                      n.webhookId = process.env.N8N_WEBHOOK_PATH;
                      webhook++;
                    }
                    if (type.toLowerCase().includes("googlegemini") ||
                        (n.credentials && Object.prototype.hasOwnProperty.call(n.credentials, "googlePalmApi"))) {
                      n.credentials = {
                        googlePalmApi: { id: process.env.N8N_CRED_ID, name: process.env.N8N_CRED_NAME },
                      };
                      gemini++;
                    }
                  }
                }
                // 數量不符就中止：與其匯入一份結構已經對不上的 workflow，不如讓部署失敗
                if (webhook !== 1) throw new Error("expected exactly 1 webhook node, got " + webhook);
                if (gemini  !== 1) throw new Error("expected exactly 1 gemini node, got "  + gemini);
                fs.writeFileSync("/tmp/wf.json", JSON.stringify(wfs));
              ' || fail "正規化 workflow JSON 失敗"

              n8n import:workflow --input=/tmp/wf.json || fail "import:workflow 失敗"
              rm -f /tmp/wf.json
              echo "[provision] workflow $N8N_WORKFLOW_ID 已匯入，webhook path = $N8N_WEBHOOK_PATH"

              # import 後 workflow 是停用的，webhook 不會註冊，backend 會完全打不到。
              # publish:workflow 是新版指令，update:workflow 是舊版（已 deprecated）。
              n8n publish:workflow --id="$N8N_WORKFLOW_ID" >/dev/null 2>&1 \
                || n8n update:workflow --id="$N8N_WORKFLOW_ID" --active=true \
                || fail "啟用 workflow 失敗"

              echo "[provision] 完成"
      {{- end }}
      containers:
        - name: n8n
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.n8n.port }}
          env:
            - name: N8N_PORT
              value: {{ .Values.n8n.port | quote }}
            - name: N8N_PATH
              value: {{ .Values.n8n.path | quote }}
            - name: N8N_PROTOCOL
              value: {{ .Values.n8n.protocol | quote }}
            - name: N8N_HOST
              value: {{ .Values.public.host | quote }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ include "care.n8nBaseUrl" . | quote }}
            - name: WEBHOOK_URL
              value: {{ include "care.n8nBaseUrl" . | quote }}
            - name: GENERIC_TIMEZONE
              value: {{ .Values.n8n.timezone | quote }}
            - name: N8N_SECURE_COOKIE
              value: {{ .Values.n8n.secureCookie | quote }}
            {{- if .Values.n8n.encryptionKey.fromSecret }}
            # ⚠ 只有在 Secret 裡放的是 PVC 現有的那把金鑰時才可以開啟。
            # 給一把新的金鑰會讓既有憑證全部解不開。做法見 values.yaml 的說明。
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.n8n.encryptionKey.secretName | quote }}
                  key: {{ .Values.n8n.encryptionKey.secretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          envFrom:
            - configMapRef:
                name: n8n-config
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        {{- if .Values.n8n.provisioning.enabled }}
        # optional: true —— ConfigMap 由 CI 建立（內容來自 CARE-n8n repo，helm 拿不到跨 repo 的檔案）。
        # 還沒建立時讓 pod 仍能啟動，由 init container 的 fail() 給出明確訊息。
        - name: n8n-workflows
          configMap:
            name: {{ .Values.n8n.provisioning.workflowConfigMap }}
            optional: true
        {{- end }}
