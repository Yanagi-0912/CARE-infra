{{- if .Values.asr.persistence.enabled }}
{{- /*
  Whisper 模型於第一次 /transcribe 請求時才由 HuggingFace 下載（約 500MB）。
  沒有這個 PVC 的話，每次 pod 重啟都要重抓一次，首個語音訊息會直接撞上逾時。
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asr-model-cache
  namespace: {{ include "care.namespace" . }}
  labels:
    {{- include "care.asr.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.asr.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.asr.persistence.size }}
{{- end }}
