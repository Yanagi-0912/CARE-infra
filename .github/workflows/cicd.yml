# CARE App CI/CD 流程
# 
# 這個 GitHub Actions workflow 自動化了：
#   1. 構建 Docker 映像（後端 & 前端）
#   2. 將映像推到 Docker Hub
#   3. 驗證 Kubernetes 資源配置
#   4. 自動部署到 Kubernetes 叢集
#
# 觸發時機：
#   - push 到 main：構建、驗證、部署（需 KUBE_CONFIG_DATA）
#   - push 到 feature/*：僅驗證 Helm（不 build、不部署）
#   - jamesbranch：不觸發 workflow（請 merge 到 main 再測）
#   - pull_request 到 main：驗證（不構建和部署）
#   - workflow_dispatch：手動觸發（支援自訂 tag）

name: care-app-build-push-deploy

# 觸發條件
on:
  push:
    # 自動在 push 到這些分支時觸發
    branches:
      - main              # 構建 → 驗證 → 部署
      - feature/*         # 僅 helm/kubeconform 驗證
  
  pull_request:
    # PR 到 main 時，只進行驗證（不構建映像）
    branches:
      - main
  
  repository_dispatch:
    # CARE / CARE-LIFF merge 到 main 後，由 trigger-deploy workflow 呼叫
    types: [deploy]

  workflow_dispatch:
    # 允許手動觸發（GitHub UI 的 Actions 頁面）
    inputs:
      custom_tag:
        description: "自訂映像標籤（可選，例如：v1.0.0）"
        required: false
        default: ""

# 全局環境變數
env:
  HELM_CHART: helm/care                     # Helm chart 路徑
  HELM_RELEASE: care                        # Helm release 名稱
  KUBE_NAMESPACE: care-dev                  # 部署的命名空間
  BACKEND_IMAGE: yanagi0912/care           # 後端映像（Docker Hub）
  FRONTEND_IMAGE: yanagi0912/care-liff     # 前端映像（Docker Hub）
  BACKEND_REPO: Yanagi-0912/CARE           # 後端原始碼 repo（與 CARE-infra 分開）
  FRONTEND_REPO: Yanagi-0912/CARE-LIFF     # 前端原始碼 repo
  BACKEND_REF: main                        # 部署永遠取 main 最新
  FRONTEND_REF: main
  N8N_IMAGE: n8nio/n8n                      # n8n 官方映像（通常不改）
  ASR_IMAGE: yanagi0912/care-asr           # 語音轉文字映像（faster-whisper）
  PARSER_IMAGE: yanagi0912/care-parser     # 文件解析映像
  N8N_STACK_REPO: Yanagi-0912/CARE-n8n     # local_asr / local_parser 原始碼 repo
  N8N_STACK_REF: main
  PUBLIC_HOST: care.jamessu2016.com         # Cloudflare Tunnel 對外網域（soselab 轉發完成後可改回 care.soselab.tw）
  PUBLIC_SCHEME: https
  VITE_API_BASE_URL: https://care.jamessu2016.com

# GitHub Actions 權限設定
permissions:
  contents: read  # 只需要讀取程式碼，不需要寫入權限

jobs:
  # 工作 1：生成映像標籤
  # 
  # 目的：根據觸發方式決定使用什麼 tag
  # 
  # Tag 生成邏輯：
  #   - 手動觸發（workflow_dispatch）且提供了 custom_tag：使用自訂 tag（例如：v1.0.0）
  #   - 其他情況（push）：使用 run_number-short_sha（例如：123-abc1234）
  # 
  # 好處：
  #   - 每次推送都有唯一的 tag，可以追蹤版本歷史
  #   - 手動部署時可以指定具體的版本
  # 
  # 輸出：
  #   - tag：映像的完整標籤
  #   - short_sha：git 短 SHA（用於快速識別）
  
  generate-tag:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # 輸出供其他工作使用
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
    steps:
      # 檢出程式碼
      - name: Checkout
        uses: actions/checkout@v5

      # 生成映像標籤
      - name: Generate image tag
        id: tag  # 步驟 ID，用於引用輸出
        run: |
          # repository_dispatch：用觸發來源 repo 的 commit；其餘用 CARE-infra 自身 commit
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            SHORT_SHA=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-7)
            echo "Triggered by ${{ github.event.client_payload.source }}@${SHORT_SHA}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
          fi
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          # 判斷是否手動觸發且提供了自訂 tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            # 使用自訂 tag
            TAG="${{ github.event.inputs.custom_tag }}"
          else
            # 使用預設 tag 格式：run_number-short_sha
            # github.run_number：這次 workflow 執行的序號（遞增的）
            TAG="${{ github.run_number }}-${SHORT_SHA}"
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

  # 工作 2：構建後端映像
  # 
  # 前置要求：
  #   1. GitHub Secrets 中設定了：
  #      - DOCKERHUB_USERNAME：Docker Hub 帳號
  #      - DOCKERHUB_TOKEN：Docker Hub 存取令牌（或 Personal Access Token）
  #   2. Dockerfile 位於 ./CARE 目錄
  # 
  # 執行時機：
  #   - 僅在 push 或 workflow_dispatch 時執行（PR 不執行）
  #   - 依賴 generate-tag 工作完成
  # 
  # 映像標籤：
  #   - 帶 tag：yanagi0912/care:123-abc1234
  #   - latest：yanagi0912/care:latest（方便快速測試，但生產環境應避免）
  # 
  # 快取優化：
  #   - cache-from: type=gha：使用 GitHub Actions 內建快取
  #   - 速度更快，減少重複構建相同的層

  build-backend:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BACKEND_REPO }}
          path: CARE
          ref: ${{ env.BACKEND_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./CARE              # Dockerfile 的上下文目錄
          push: true                   # 推送到 Docker Hub
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.generate-tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 工作 3：構建前端映像
  # 
  # 與後端的差異：
  #   - 使用 build-args 注入 React 環境變數
  #   - VITE_LIFF_ID：LINE LIFF 應用 ID（編譯時決定，無法在運行時改變）
  #   - VITE_API_BASE_URL：API 伺服器位址（前端需要知道後端在哪裡）
  # 
  # 前置要求：
  #   - GitHub Secrets 中設定：
  #     - VITE_LIFF_ID：LINE LIFF ID
  #     - VITE_API_BASE_URL：網域根 URL（例如 https://example.com；程式會加 /api/...）
  #   - ./CARE-LIFF 目錄有 Dockerfile 和 React 程式碼

  build-frontend:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          repository: ${{ env.FRONTEND_REPO }}
          path: CARE-LIFF
          ref: ${{ env.FRONTEND_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./CARE-LIFF          # React 應用目錄
          # 傳遞構建參數給 Dockerfile
          # 這些值會在構建時注入到 React 代碼中
          build-args: |
            VITE_LIFF_ID=${{ secrets.VITE_LIFF_ID }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.generate-tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 工作 3.5：構建 n8n stack 的下游服務映像（ASR / Parser）
  #
  # 背景：
  #   這兩個服務原本只存在於 CARE-n8n 的 docker-compose，上雲時被漏掉，
  #   導致 n8n workflow 呼叫不到下游、webhook 回空 body、所有多媒體訊息失效。
  #
  # 與後端／前端的差異：
  #   - 原始碼在 CARE-n8n repo，且 Dockerfile 位於子目錄（local_asr / local_parser）
  #   - ASR 映像較大（faster-whisper + ctranslate2），build 時間明顯較長
  #   - Whisper 模型不打包進映像，改由 runtime 下載並存到 PVC

  build-asr:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout n8n stack
        uses: actions/checkout@v5
        with:
          repository: ${{ env.N8N_STACK_REPO }}
          path: CARE-n8n
          ref: ${{ env.N8N_STACK_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ASR
        uses: docker/build-push-action@v7
        with:
          context: ./CARE-n8n/local_asr
          push: true
          tags: |
            ${{ env.ASR_IMAGE }}:${{ needs.generate-tag.outputs.tag }}
            ${{ env.ASR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-parser:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout n8n stack
        uses: actions/checkout@v5
        with:
          repository: ${{ env.N8N_STACK_REPO }}
          path: CARE-n8n
          ref: ${{ env.N8N_STACK_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Parser
        uses: docker/build-push-action@v7
        with:
          context: ./CARE-n8n/local_parser
          push: true
          tags: |
            ${{ env.PARSER_IMAGE }}:${{ needs.generate-tag.outputs.tag }}
            ${{ env.PARSER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 工作 4：驗證 Kubernetes 資源配置
  # 
  # 目的：確保 Helm chart 渲染結果有效，早期發現配置問題
  # 
  # 驗證步驟：
  #   1. helm lint 檢查 chart
  #   2. helm template 渲染 manifest
  #   3. kubeconform 離線驗證 YAML（CI 無 Kubernetes 叢集，不需連 API）
  # 
  # 優點：
  #   - 所有分支都驗證，PR 時不會意外合併有問題的配置
  #   - 快速反饋，開發者立即發現問題

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Validate Helm chart
        run: |
          helm lint "${{ env.HELM_CHART }}"
          helm template "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace "${{ env.KUBE_NAMESPACE }}" \
            --set backend.image.tag=ci-validate \
            --set frontend.image.tag=ci-validate \
            --set asr.image.tag=ci-validate \
            --set parser.image.tag=ci-validate \
            > rendered.yaml
          test -s rendered.yaml
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz
          ./kubeconform -summary -ignore-missing-schemas rendered.yaml

  # 工作 5：部署到 Kubernetes 叢集（Push 式 CD）
  # 
  # 執行條件：
  #   - push 到 main（自動部署）
  #   - 或手動 workflow_dispatch 觸發
  #   - 並且所有先前的工作都成功
  #   - 須在 K3s VM 上執行 self-hosted runner（KUBE API 為 127.0.0.1:6443，雲端 runner 連不到）
  # 
  # 部署步驟：
  #   1. 設定 kubeconfig（連接叢集）
  #   2. 建立或更新 Secret（敏感資訊）
  #   3. helm upgrade --install 部署（--set 注入映像 tag）
  #   5. 等待 rollout 完成
  #   6. 驗證部署成功
  # 
  # 前置要求：
  #   - GitHub Secrets 中設定了：
  #     - KUBE_CONFIG_DATA：kubeconfig 的 base64 編碼（包含叢集位址、認證等）
  #     - 所有敏感資訊：GEMINI_API_KEY、MONGODB_URI、LINE_*、LIFF_*、REDIS_URL、FIRECRAWL_API_KEY、COHERE_API_KEY 等

  deploy:
    needs:
      - generate-tag      # 需要映像標籤
      - build-backend     # 需要後端映像
      - build-frontend    # 需要前端映像
      - build-asr         # asr.enabled: true，helm 會用這次 run 的 tag 拉映像
      - build-parser      # parser.enabled: true，同上
      - validate          # 需要驗證通過
      # 要再關掉 asr／parser 時，這兩行一起拿掉：不然 CARE-n8n 那邊一個還沒寫完
      # 的 commit 就會讓 backend 與 frontend 的部署跟著停擺。
    # 僅 push main 或手動觸發時部署
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, care-gcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # n8n 的 workflow JSON 在 CARE-n8n repo，部署時要做成 ConfigMap 給
      # n8n deployment 的 provisioning init container 讀。
      - name: Checkout n8n stack
        uses: actions/checkout@v5
        with:
          repository: ${{ env.N8N_STACK_REPO }}
          path: CARE-n8n
          ref: ${{ env.N8N_STACK_REF }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Load kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          # self-hosted runner 在 K3s 同一台 VM：直接用本機 k3s.yaml（127.0.0.1:6443 才連得到）
          if [ -r /etc/rancher/k3s/k3s.yaml ]; then
            cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          elif [ -n "$KUBE_CONFIG_DATA" ]; then
            echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          else
            echo "::error::找不到 /etc/rancher/k3s/k3s.yaml，且未設定 KUBE_CONFIG_DATA"
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Verify cluster connection
        run: kubectl cluster-info

      # 部署前先確認磁碟餘裕。
      # 2026-08-10 事故：VM 磁碟寫滿 → kubelet 觸發 DiskPressure → 驅逐 Traefik
      # → 對外 502。與其把新版本部署到一個注定被驅逐的節點，不如在這裡提早失敗。
      - name: Preflight - 檢查節點磁碟餘裕
        run: |
          USED=$(df -P / | awk 'NR==2 { gsub(/%/, "", $5); print $5 }')
          echo "節點磁碟使用率：${USED}%"
          # 90% 對應 kubelet 的 nodefs.available<10% 驅逐門檻
          if [ "$USED" -ge 90 ]; then
            echo "::error::磁碟使用率 ${USED}% 已達 kubelet 驅逐門檻，中止部署。請先在 VM 執行 sudo /usr/local/sbin/vm-disk-guard.sh check"
            exit 1
          fi
          if [ "$USED" -ge 80 ]; then
            echo "::warning::磁碟使用率 ${USED}% 已超過警戒水位，請確認 care-disk-guard.timer 正常運作"
          fi

      - name: Create k8s Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LIFF_CHANNEL_ID: ${{ secrets.LIFF_CHANNEL_ID }}
          LIFF_CHANNEL_SECRET: ${{ secrets.LIFF_CHANNEL_SECRET }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          # 台語 STT／TTS（Taigi AI Labs）。沒設不擋部署：語言選台語的使用者照舊走國語語音。
          TAIGI_API_KEY: ${{ secrets.TAIGI_API_KEY }}
        run: |
          # 沒設時後端會退回 config.py 的 "dev-only-change-me"，讀過原始碼的人都能
          # 簽出任意使用者的登入 token。寧可在這裡讓部署失敗。
          if [ -z "$AUTH_JWT_SECRET" ]; then
            echo "::error::GitHub secret AUTH_JWT_SECRET 未設定"
            exit 1
          fi
          kubectl create secret generic care-backend-secret \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=LINE_CHANNEL_ID="$LINE_CHANNEL_ID" \
            --from-literal=LINE_CHANNEL_SECRET="$LINE_CHANNEL_SECRET" \
            --from-literal=LINE_CHANNEL_ACCESS_TOKEN="$LINE_CHANNEL_ACCESS_TOKEN" \
            --from-literal=LIFF_CHANNEL_ID="$LIFF_CHANNEL_ID" \
            --from-literal=LIFF_CHANNEL_SECRET="$LIFF_CHANNEL_SECRET" \
            --from-literal=LIFF_ID="$LIFF_ID" \
            --from-literal=REDIS_URL="$REDIS_URL" \
            --from-literal=FIRECRAWL_API_KEY="$FIRECRAWL_API_KEY" \
            --from-literal=COHERE_API_KEY="$COHERE_API_KEY" \
            --from-literal=AUTH_JWT_SECRET="$AUTH_JWT_SECRET" \
            --from-literal=TAIGI_API_KEY="$TAIGI_API_KEY" \
            -n "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # n8n 的憑證與 workflow 存在 PVC 的 SQLite 裡，helm 管不到，過去只能靠人手動
      # 在 UI 或 CLI 補。2026-08-04 起圖片辨識全數失敗就是因為沒人補憑證，而 repo
      # 早已修好的模型也從未同步到線上。這一步把 workflow 內容納入部署；憑證則由
      # n8n deployment 的 init container 從 care-backend-secret 產生。
      #
      # ConfigMap 的 key 只允許 [-._a-zA-Z0-9]，原檔名 "mutimedia process.json"
      # 含空白，因此複製時改名。
      - name: Create n8n workflow ConfigMap
        run: |
          SRC="CARE-n8n/resources/workflows/mutimedia process.json"
          if [ ! -f "$SRC" ]; then
            echo "::error::找不到 $SRC（CARE-n8n 的 workflow 路徑是否改過？）"
            exit 1
          fi
          # 先驗證是合法 JSON。壞掉的檔案讓部署在這裡失敗，比讓 init container
          # 在叢集裡失敗好查。
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$SRC"; then
            echo "::error::$SRC 不是合法 JSON"
            exit 1
          fi
          mkdir -p .n8n-provision
          cp "$SRC" .n8n-provision/mutimedia-process.json
          kubectl create configmap n8n-workflows \
            --from-file=.n8n-provision/mutimedia-process.json \
            -n "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          # 內容雜湊寫進 pod annotation：workflow 有變才滾動更新 n8n
          CHECKSUM=$(sha256sum .n8n-provision/mutimedia-process.json | cut -c1-16)
          echo "N8N_WORKFLOW_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "workflow checksum = $CHECKSUM"

      - name: Deploy with Helm
        run: |
          helm upgrade --install "${{ env.HELM_RELEASE }}" "${{ env.HELM_CHART }}" \
            --namespace "${{ env.KUBE_NAMESPACE }}" \
            --create-namespace \
            --set namespace.create=false \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ needs.generate-tag.outputs.tag }} \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ needs.generate-tag.outputs.tag }} \
            --set frontend.image.pullPolicy=Always \
            --set asr.image.repository=${{ env.ASR_IMAGE }} \
            --set asr.image.tag=${{ needs.generate-tag.outputs.tag }} \
            --set asr.image.pullPolicy=Always \
            --set parser.image.repository=${{ env.PARSER_IMAGE }} \
            --set parser.image.tag=${{ needs.generate-tag.outputs.tag }} \
            --set parser.image.pullPolicy=Always \
            --set public.host=${{ env.PUBLIC_HOST }} \
            --set public.scheme=${{ env.PUBLIC_SCHEME }} \
            --set n8n.provisioning.workflowChecksum=${{ env.N8N_WORKFLOW_CHECKSUM }} \
            --wait --timeout 15m

      # 等待所有 Deployment 完成滾動更新
      - name: Wait for rollouts
        run: |
          # kubectl rollout status：監控 Deployment 的滾動更新進度
          # --timeout=5m：如果 5 分鐘內沒完成則失敗
          # 防止部署卡住，確保部署及時完成
          # 一定存在的四個。care-scheduler 是背景排程器（用藥提醒、每日諮詢
          # 摘要），與 backend 共用同一個映像、以 APP_ROLE 區分角色。它必須列在
          # 這裡：backend 一旦轉成 APP_ROLE=api 就不再自己跑排程，若 scheduler
          # 沒起來而部署卻回報成功，用藥提醒會靜靜停擺，而錯過的時段不補推播。
          for d in care-backend care-frontend care-n8n care-scheduler; do
            kubectl rollout status "deployment/$d" -n "$KUBE_NAMESPACE" --timeout=5m
          done

          # care-asr / care-parser / care-tts 由 values.yaml 的 asr.enabled /
          # parser.enabled / tts.enabled 控制，任一個可能是關的。存在才等待——直接
          # 無條件 rollout status 會在 Deployment 不存在時失敗，把整個部署判成失敗，
          # 即使 backend 其實已經更新成功。
          for d in care-asr care-parser care-tts; do
            if kubectl get "deployment/$d" -n "$KUBE_NAMESPACE" >/dev/null 2>&1; then
              kubectl rollout status "deployment/$d" -n "$KUBE_NAMESPACE" --timeout=5m
            else
              echo "跳過 $d：未部署（helm values 中已停用）"
            fi
          done

      # 輸出部署資訊
      - name: Print deployment info
        run: |
          echo "=== Deployment Complete ==="
          echo "Image tag: ${{ needs.generate-tag.outputs.tag }}"
          echo "Services:"
          # 列出所有建立的 Service，驗證部署成功
          kubectl get svc -n "$KUBE_NAMESPACE"

      # 每次部署都用新的映像 tag，舊 tag 會留在 k3s 的 containerd 裡持續累積。
      # kubelet 的映像 GC 要到 85% 才啟動，等它動手時節點已經很接近驅逐門檻，
      # 所以部署成功後主動回收一次，讓水位維持在安全區。
      # 這一步失敗不影響部署結果 —— 部署已經成功，回收只是衛生工作。
      - name: Post-deploy - 回收空間並檢查守門員
        if: success()
        continue-on-error: true
        run: |
          GUARD=/usr/local/sbin/vm-disk-guard.sh
          BEFORE=$(df -P / | awk 'NR==2 { gsub(/%/, "", $5); print $5 }')

          if [ ! -x "$GUARD" ]; then
            echo "::warning::VM 尚未安裝磁碟守門員，略過回收。請在 VM 執行：sudo bash scripts/install-vm-maintenance.sh --fix-kubeconfig --enable-ci-sudo"
          elif sudo -n "$GUARD" check; then
            echo "守門員巡檢完成"
          else
            echo "::warning::無法免密碼執行守門員。請在 VM 重跑安裝腳本並加上 --enable-ci-sudo"
          fi

          # 守門員是主機層元件，不由 helm 部署，所以可能與 repo 版本脫節。
          # 這裡只告警不自動更新 —— 自動更新需要 root 執行 repo 裡的檔案，
          # 等於把 VM 的 root 交給任何能 push 到 main 的人。
          if [ -x "$GUARD" ] && ! cmp -s scripts/vm-disk-guard.sh "$GUARD"; then
            echo "::warning::VM 上的守門員與 repo 版本不一致，請重跑：sudo bash scripts/install-vm-maintenance.sh"
          fi

          AFTER=$(df -P / | awk 'NR==2 { gsub(/%/, "", $5); print $5 }')
          echo "磁碟使用率：${BEFORE}% -> ${AFTER}%"